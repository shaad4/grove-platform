<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>You're offline — Grove</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F7F8F7;
      color: #141A14;
      font-family: Inter, system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    img { width: 72px; height: 72px; margin-bottom: 20px; border-radius: 16px; }
    h1 { font-size: 18px; font-weight: 500; margin: 0 0 8px; }
    p { font-size: 14px; color: #4A544A; margin: 0 0 20px; }
    button {
      background: #0F6E56;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="/icons/icon-192x192.png" alt="Grove" />
  <h1>You're offline</h1>
  <p>Check your connection and try again.</p>
  <button onclick="window.location.reload()">Retry</button>
</body>
</html>
