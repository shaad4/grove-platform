server {
    listen 80;
    server_name groven.in *.groven.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.groven.in;

    ssl_certificate     /etc/letsencrypt/live/groven.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/groven.in/privkey.pem;

    location /ws/ {
        proxy_pass http://daphne:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        gzip on;
        gzip_types text/plain application/json application/javascript text/xml;
        gzip_min_length 1000;
    }
}

server {
    listen 443 ssl;
    server_name groven.in *.groven.in;

    ssl_certificate     /etc/letsencrypt/live/groven.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/groven.in/privkey.pem;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.json {
        proxy_pass http://backend:8000/api/tenants/manifest.json;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
        gzip_vary on;
        gzip_min_length 1000;
    }
}